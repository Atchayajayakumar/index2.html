<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kookie Travels</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    /* background:#b41cbf; */
    background-image: url(website\ background.jpg);
}

/* Header */

header{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 80px;
    border-radius: 20px 20px 0 0;
}

.logo{
    height: 100px;
    font-size:55px;
    font-weight:bold;
    color:#000;
    background: rgba(223, 149, 30, 0.927);
}

nav a{
    text-decoration:none;
    color:#000;
    margin-left:40px;
    font-size:28px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:blue;
}

/* Home */

.home{
    width:100%;
    min-height:80vh;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:40px 80px;
}

.left{
    width:55%;
}

.left h2{
    font-size:70px;
    margin-bottom:20px;
}

.left h2 span{
    color:blue;
}

.left h1{
    font-size:55px;
    margin-bottom:25px;
}

.left p{
    font-size:28px;
    line-height:1.8;
    margin-bottom:40px;
}

.hero{
    width: 400px;
    height: 400px;
    border-radius: 40px;
    background:  aqua;
    align-items: center;
    text-align: center;
    justify-content: space-around;
    margin-left:500px;
    margin-top: 100px;
    padding-top: 50px;
    animation-name: a;
    animation-iteration-count: infinite;
    /* animation-delay: 2s; */
    animation-duration: 10s;
    /* background-image: ; */

}
/* Button */

.btn{
    display:inline-block;
    padding:18px 40px;
    background:#000;
    color:#fff;
    text-decoration:none;
    border-radius:10px;
    font-size:22px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:blue;
}

/* Right Side */

.right{
    width:40%;
    display:flex;
    justify-content:center;
}

.right img{
    width:420px;
    height:500px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}



.social{
    margin-top:35px;
}

.social a{
    color:#000;
    font-size:35px;
    margin-right:20px;
    transition:.3s;
}

.social a:hover{
    color:blue;
}


.hero{
 
    background-size: cover;
    align-items: center;
    background-position: center;
    background-repeat: no-repeat;
}
@keyframes a{

    0%{
        background: red;
    }
    25%{
        background-color: bisque;
    }
    50%{
        background-color: blue;
    }
    75%{
        background-color: coral;
    }
    100%{
        background-color:darkblue;
    }
    
}
footer{
    margin-top: 200px;
    background: #1f1d1d;
    height: 50px;
    color: white;
    text-align: center;
    align-items: center;
    border-radius: 0 0 20px 20px;
    margin-bottom: 0;

}
footer p{
    padding: 18px;
}

</style>
<body>

<header class = "logo">

    <div >
        🌍 kookie travels
        
    </div>
  

    <nav>
        <a href="index.html"></a>
        <a href="resortpage.html">Resorts</a>
        <a href="package.html">Packages</a>
        <a href="gallery.html">Gallery</a>
        <a href="contactpage.html">Contact</a>
    </nav>

</header>



<section class="hero">

    <div class="overlay">

        <h1>Explore The World</h1>

        <p>Discover Your Dream Destination With Aurora Travels</p>
        <br>
        <br>

        <div class="search-box">

            <input type="text" placeholder="Where to?">

            <input type="date">

            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

    </div>

</section>
<footer class="fire">
<p>© 2026 kookie travels.All Rights Reserved</p>

</footer>

</body>
</html>
