<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Aurora Travels</title>

    <link rel="stylesheet" href="contact.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:url("images/contact-bg.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;

}

header{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 60px;

    background:rgba(0,0,0,.75);

}

.logo{

    color:white;
    font-size:38px;
    font-weight:bold;

}

nav a{

    color:white;
    text-decoration:none;
    margin-left:30px;
    font-size:22px;
    font-weight:bold;

}

nav a:hover,
.active{

    color:orange;

}

.contact{

    display:flex;
    justify-content:space-evenly;
    align-items:center;

    min-height:85vh;

}

.left{

    width:40%;
    color:rgb(24, 10, 10);

}

.left h1{

    font-size:50px;
    margin-bottom:20px;

}

.left p{

    font-size:22px;
    margin-bottom:35px;

}

.info{

    font-size:22px;
    margin:20px 0;

}

.info i{

    color:orange;
    margin-right:15px;

}

.social{

    margin-top:35px;

}

.social i{

    font-size:35px;

    margin-right:20px;

    cursor:pointer;

    transition:.4s;

}

.social i:hover{

    color:orange;
    transform:scale(1.2);

}

.right{

    width:35%;

    background:rgba(255,255,255,.15);

    padding:35px;

    border-radius:15px;

    backdrop-filter:blur(10px);

}

input,
textarea{

    width:100%;

    padding:15px;

    margin-bottom:20px;

    border:none;

    border-radius:8px;

    font-size:18px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    background:orange;

    color:rgb(27, 6, 6);

    font-size:22px;

    border-radius:8px;

    cursor:pointer;

}

button:hover{

    background:#ff6600;

}

footer{

    text-align:center;

    background:black;

    color:rgb(37, 6, 6);

    padding:20px;

}
</style>
<body>

<header>

    <div class="logo">
        🌍 kookie  Travels
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="resorts.html">Resorts</a>
        <a href="packages.html">Packages</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

</header>


<section class="contact">

    <div class="left">

        <h1>Contact Us</h1>

        <p>Plan your dream vacation with Aurora Travels. Contact us anytime.</p>

        <div class="info">
            <i class="fa-solid fa-location-dot"></i>
            Chennai, Tamil Nadu, India
        </div>

        <div class="info">
            <i class="fa-solid fa-phone"></i>
            +91 98765 43210
        </div>

        <div class="info">
            <i class="fa-solid fa-envelope"></i>
            kookietravels@gmail.com
        </div>

        <div class="social">

            <i class="fa-brands fa-instagram"></i>

            <i class="fa-brands fa-whatsapp"></i>

            <i class="fa-brands fa-linkedin"></i>

            <i class="fa-brands fa-youtube"></i>

        </div>

    </div>


    <div class="right">

        <form>

            <input type="text" placeholder="Your Name">

            <input type="email" placeholder="Your Email">

            <input type="text" placeholder="Subject">

            <textarea rows="6" placeholder="Message"></textarea>

            <button>Send Message</button>

        </form>

    </div>

</section>

<footer>

    © 2026 Aurora Travels | All Rights Reserved.

</footer>

</body>
</html>
