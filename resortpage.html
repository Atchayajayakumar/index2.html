<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resorts</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<style>
    .resorts{
    padding:70px;
    background:#f5f5f5;
}

.resorts h1{
    text-align:center;
    font-size:45px;
    margin-bottom:40px;
}

.resort-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
    transition:.4s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h2{
    margin-bottom:10px;
}

.content p{
    margin:10px 0;
    font-size:18px;
}

button{
    padding:12px 25px;
    background:#ff9800;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#e68900;
}
</style>

<body>

<header>

<div class="logo">
🌍 kookie Travels
</div>




</header>

<section class="resorts">

<h1>Luxury Resorts</h1>

<div class="resort-container">

<div class="card">

<img src="maldives resort.jpg">

<div class="content">
<h2>Maldives Resort</h2>
<p>⭐⭐⭐⭐⭐</p>
<p>₹25,000 / Night</p>

<button>Book Now</button>

</div>

</div>

<div class="card">

<img src="bali.jpg">

<div class="content">
<h2>Bali Resort</h2>
<p>⭐⭐⭐⭐</p>
<p>₹18,000 / Night</p>

<button>Book Now</button>

</div>

</div>

<div class="card">

<img src="goa.jpg">

<div class="content">
<h2>Goa Beach Resort</h2>

<p>⭐⭐⭐⭐⭐</p>
<p>₹12,000 / Night</p>

<button>Book Now</button>

</div>

</div>

<div class="card">

<img src="swiss.webp">

<div class="content">
<h2>Swiss Resort</h2>
<p>⭐⭐⭐⭐⭐</p>
<p>₹30,000 / Night</p>

<button>Book Now</button>

</div>

</div>

</div>

</section>

</body>
</html>
