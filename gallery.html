<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Aurora Travels</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    background:#222;
}

.logo{
    color:white;
    font-size:35px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:30px;
    font-size:22px;
    font-weight:bold;
}

nav a:hover,
.active{
    color:orange;
}

.gallery{
    padding:60px;
    text-align:center;
}

.gallery h1{
    font-size:45px;
    color:#333;
}

.gallery p{
    margin-top:10px;
    font-size:20px;
    color:#666;
}

.gallery-container{
    margin-top:50px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

.image-box{
    overflow:hidden;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.image-box img{
    width:100%;
    height:250px;
    object-fit:cover;
    transition:.5s;
}

.image-box:hover img{
    transform:scale(1.1);
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}
</style>
<body>

<header>
    <div class="logo">
        🌍 kookie Travels
    </div>

   
</header>

<section class="gallery">
    <h1>Travel Gallery</h1>
    <p>Explore the beauty of the world's best destinations.</p>

    <div class="gallery-container">

        <div class="image-box">
            <img src="images/france.jpg" alt="">
        </div>

        <div class="image-box">
            <img src="maldives.jpg" alt="">
        </div>

        <div class="image-box">
            <img src="dubai.jpg" alt="">
        </div>

        <div class="image-box">
            <img src="switzerland.avif" alt="">
        </div>

        <div class="image-box">
            <img src="bali.jpg" alt="">
        </div>

        <div class="image-box">
            <img src="goa photo.jpg" alt="">
        </div>

        <div class="image-box">
            <img src="singapore.jpg" alt="">
        </div>

        <div class="image-box">
            <img src="images/thailand.avif" alt="">
        </div>

    </div>
</section>

<footer>
   <p>© 2026 kookie travels.All Rights Reserved</p>
</footer>

</body>
</html>
